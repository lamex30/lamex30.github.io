<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="LAMEX — портфолио: дизайн, вайбкод-сайты, музыка, 3D, видео, персонажи и скины.">
<meta name="theme-color" content="#F2EDE3">
<title>LAMEX</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=PT+Mono&family=Press+Start+2P&family=Rubik+Mono+One&family=Playfair+Display:ital,wght@1,900&family=Monoton&family=Bungee+Shade&display=swap">
<style>
/* Layout: a fixed paper header with a shape-shifting wordmark and tabs; each tab is an endless dotted desk of pinned printouts */
:root{
  --paper:#F2EDE3;
  --paper-2:#E9E2D4;
  --sheet:#FFFDF8;
  --ink:#141414;
  --ink-2:#55514A;
  --red:#FF2A1A;
  --yellow:#FFD60A;
  --dot:rgba(20,20,20,.13);
  --f-code:"Fira Code",ui-monospace,Menlo,monospace;
  --f-mono:"PT Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.2,1.5,.35,1);
  --out:cubic-bezier(.2,.9,.25,1);
  --headh:74px;
  --sh:rgba(20,20,20,.26);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-mono);overflow:hidden}
.head,.stack,.desk,.home,.hint,.player,.feed .stand{-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none;user-drag:none}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--yellow);color:var(--ink)}
:focus-visible{outline:2px dashed var(--red);outline-offset:3px}
[hidden]{display:none!important}

/* ============ HEADER ============ */
.head{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;height:var(--headh);display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--paper);border-bottom:2px solid var(--ink)}
.logo{flex:0 0 auto;width:220px;height:52px;display:flex;align-items:center;border:0;background:none;padding:0;white-space:nowrap;line-height:1;overflow:visible}
.logo span{display:inline-block;transition:transform .35s var(--spring)}
.logo .ast{color:var(--red)}
.logo-meta{font:400 10px/1.2 var(--f-mono);color:var(--ink-2);letter-spacing:.06em;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;align-items:stretch;height:100%}
.tab{position:relative;display:flex;align-items:center;gap:6px;border:0;background:none;padding:0 12px;font:500 13px/1 var(--f-code);letter-spacing:.02em;border-inline:1.5px solid transparent;transition:background .2s}
.tab:hover{background:var(--paper-2)}
.tab .i{font-size:10px;color:var(--ink-2)}
.tab[aria-current="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-current="true"] .i{color:var(--yellow)}
.tab .chev{display:inline-block;transition:transform .35s var(--spring);font-size:11px}
.tab[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lang{display:flex;border:1.5px solid var(--ink);margin-left:6px}
.lang button{border:0;background:none;padding:6px 8px;font:500 11px/1 var(--f-code)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* sheet stack under a tab (from the sketch: big category card, smaller sheets under it) */
.stack{position:fixed;z-index:45;top:calc(var(--headh) + env(safe-area-inset-top,0px) - 2px);width:260px;perspective:800px;pointer-events:none}
.stack.open{pointer-events:auto}
.stack .sheet{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:-2px;border:2px solid var(--ink);background:var(--sheet);padding:12px 14px;font:500 14px/1 var(--f-code);text-align:left;transform-origin:50% 0;transform:rotateX(-92deg);opacity:0;transition:transform .5s var(--spring),opacity .15s,background .15s}
.stack .sheet:first-child{border-top-width:2px}
.stack .sheet small{font:400 11px/1 var(--f-mono);color:var(--ink-2)}
.stack.open .sheet{transform:none;opacity:1}
.stack .sheet:hover{background:var(--yellow)}
.stack .sheet:hover small{color:var(--ink)}
.stack .sheet .n{color:var(--red);margin-right:8px}

/* ============ DESK ============ */
.desk{position:fixed;inset:calc(var(--headh) + env(safe-area-inset-top,0px)) 0 0 0;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:28px 28px}
.desk.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world.fly{transition:transform .9s cubic-bezier(.65,0,.2,1)}

.cluster-label{position:absolute;display:flex;align-items:baseline;gap:10px;white-space:nowrap;pointer-events:none;transform:rotate(-2deg)}
.cluster-label b{font:700 44px/1 var(--f-code);letter-spacing:-1px}
.cluster-label b i{font-style:normal;color:var(--red)}
.cluster-label span{font:400 13px/1 var(--f-mono);color:var(--ink-2)}

.print{position:absolute;left:0;top:0;padding:12px 12px 10px;background:var(--sheet);border:1px solid rgba(20,20,20,.12);
  box-shadow:5px 5px 0 var(--sh);cursor:pointer;user-select:none;-webkit-user-drag:none;
  transform:translate(var(--x),var(--y)) rotate(var(--r));transition:box-shadow .25s var(--out),transform .45s var(--spring)}
.print img{display:block;width:100%;height:auto;pointer-events:none;background:var(--paper-2)}
.print figcaption{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font:400 11px/1.2 var(--f-mono);color:var(--ink-2)}
.print figcaption b{font:500 12px/1.2 var(--f-code);color:var(--ink)}
.print .tape,.pre-sheet .tape{position:absolute;top:-11px;left:50%;width:72px;height:22px;margin-left:-36px;background:var(--yellow);opacity:.82;transform:rotate(var(--tr,-4deg));
  clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 50%)}
.print:hover{box-shadow:8px 8px 0 var(--sh);transform:translate(var(--x),var(--y)) rotate(calc(var(--r) * .4)) translateY(-4px) scale(1.015);z-index:5}
.print.held{transition:box-shadow .2s;box-shadow:13px 13px 0 var(--sh);transform:translate(var(--x),var(--y)) rotate(calc(var(--r) * .2)) scale(1.05);z-index:10;cursor:grabbing}
.print.drop{animation:drop .9s var(--spring) both;animation-delay:var(--d,0s)}
@keyframes drop{0%{opacity:0;transform:translate(var(--x),calc(var(--y) - 180px)) rotate(calc(var(--r) * -3)) scale(1.15)}40%{opacity:1}100%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.print.ping{animation:ping .7s var(--spring)}
@keyframes ping{0%{transform:translate(var(--x),var(--y)) rotate(var(--r))}35%{transform:translate(var(--x),var(--y)) rotate(calc(var(--r) - 5deg)) scale(1.06)}70%{transform:translate(var(--x),var(--y)) rotate(calc(var(--r) + 3deg))}100%{transform:translate(var(--x),var(--y)) rotate(var(--r))}}

.print.note{width:300px;padding:22px 20px;background:var(--yellow);border-color:rgba(20,20,20,.18);font:400 14px/1.5 var(--f-mono)}
.note b{display:block;font:700 22px/1.1 var(--f-code);margin-bottom:8px}

/* back-to-work button + hint */
.home{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,160%);border:2px solid var(--ink);background:var(--red);color:#fff;
  font:500 14px/1 var(--f-code);padding:13px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .5s var(--spring)}
.home.show{transform:translate(-50%,0)}
.home:active{box-shadow:1px 1px 0 var(--ink);transform:translate(calc(-50% + 3px),3px)}
.hint{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;font:400 11px/1.4 var(--f-mono);color:var(--ink-2);background:var(--paper);padding:6px 8px;border:1.5px dashed var(--ink-2)}

/* lightbox: the print, picked up and held close */
.lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(242,237,227,.86);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.lb figure{margin:0;max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--sheet);padding:16px 16px 12px;border:1px solid rgba(20,20,20,.15);box-shadow:10px 10px 0 var(--sh);animation:pick .6s var(--spring)}
@keyframes pick{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.lb img{display:block;max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;margin:0 auto}
.lb figcaption{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;font:400 12px/1.3 var(--f-mono);color:var(--ink-2)}
.lb figcaption b{font:700 16px/1.2 var(--f-code);color:var(--ink)}
.lb .x{border:2px solid var(--ink);background:var(--sheet);font:500 12px/1 var(--f-code);padding:8px 10px}
.lb .x:hover{background:var(--red);color:#fff}

/* ============ HOME / ABOUT ============ */
.about{position:fixed;inset:calc(var(--headh) + env(safe-area-inset-top,0px)) 0 0 0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding:40px clamp(18px,5vw,80px);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:28px 28px}
.on-home .desk,.on-home .hint,.on-home .home{display:none}
.about-path{margin:0 0 14px;font:400 12px/1 var(--f-mono);color:var(--ink-2);display:inline-block;border:1.5px dashed var(--ink-2);padding:6px 8px}
.about-hi{margin:0 0 26px;height:clamp(96px,11vw,170px);display:flex;align-items:center;white-space:nowrap;line-height:1;overflow:visible;animation:rise .8s var(--spring) both}
.about-hi span{display:inline-block;transition:transform .35s var(--spring)}
.about-hi .ast{color:var(--red)}
.about-p{margin:0 0 14px;max-width:62ch;font:400 16px/1.6 var(--f-mono);animation:rise .7s var(--spring) both}
.about-p:nth-of-type(2){animation-delay:.12s}.about-p:nth-of-type(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(24px) rotate(1deg)}}
.cta{margin-top:12px;border:2px solid var(--ink);background:var(--red);color:#fff;font:500 15px/1 var(--f-code);padding:14px 20px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s,box-shadow .15s;animation:rise .7s var(--spring) .35s both}
.cta:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.cta:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.about-desk{position:relative;min-height:520px}
.about .print{--x:0px;--y:0px;cursor:default}
.about-mascot{position:absolute!important;width:min(520px,92%);left:0;top:0;--r:-5deg;animation:dropIn .9s var(--spring) .2s backwards;transform:rotate(var(--r))}
.about-spec{position:absolute!important;width:min(330px,76%);left:auto;top:auto;right:0;bottom:0;--r:4deg;padding:20px 20px 16px!important;animation:dropIn .9s var(--spring) .4s backwards;transform:rotate(var(--r))}
@keyframes dropIn{0%{opacity:0;transform:translateY(-160px) rotate(calc(var(--r) * -3)) scale(1.1)}40%{opacity:1}100%{opacity:1;transform:rotate(var(--r))}}
.about .print:hover{transform:rotate(calc(var(--r) * .3)) translateY(-4px)}
.spec-h{margin:0 0 12px;font:500 12px/1 var(--f-code);color:var(--red)}
.about-spec dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font:400 13px/1.35 var(--f-mono)}
.about-spec dt{color:var(--ink-2)}
.about-spec dd{margin:0}
@media (max-width:900px){
  .about{grid-template-columns:1fr;align-items:start}
  .about-desk{min-height:0;display:grid;gap:26px;padding:10px 6px 40px}
  .about-mascot,.about-spec{position:relative!important;width:100%;left:auto;top:auto;right:auto;bottom:auto}
}

/* ============ PHONE: a plain feed instead of the desk ============ */
.feed{display:none}
@media (max-width:720px){
  :root{--headh:112px}
  body{overflow:auto}
  .head{flex-wrap:wrap;height:auto;min-height:var(--headh);padding:10px 16px 0;gap:6px 12px;align-content:flex-start}
  .logo{width:170px;height:42px}
  .logo-meta{display:none}
  .lang{margin-left:auto}
  .tabs{order:3;flex:0 0 calc(100% + 32px);margin:0 -16px;height:44px;overflow-x:auto;scrollbar-width:none;border-top:1.5px solid var(--ink);padding-inline:8px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap}
  .desk,.hint,.home{display:none}
  .feed{display:block;padding:calc(var(--headh) + 24px) 16px calc(40px + env(safe-area-inset-bottom,0px))}
  .feed section{margin-bottom:34px}
  .feed h2{position:sticky;top:calc(var(--headh) + 8px);z-index:3;display:inline-block;margin:0 0 14px;background:var(--paper);font:700 28px/1 var(--f-code);letter-spacing:-.5px;padding:4px 6px 4px 0}
  .feed h2 i{font-style:normal;color:var(--red)}
  .feed .print{position:relative;display:block;margin:0 0 22px;transform:rotate(var(--r));transition:transform .5s var(--spring)}
  .feed .print:nth-child(odd){margin-right:8px}
  .feed .print:nth-child(even){margin-left:8px}
  .feed .print.in{animation:none}
  .stack{width:calc(100% - 32px);left:16px!important}
}

/* ============ PRELOADER: every asset is pulled in before the desk opens ============ */
.pre{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:28px 28px;-webkit-user-select:none;user-select:none;touch-action:none;transition:transform .8s cubic-bezier(.7,0,.2,1) .35s}
.pre.done{transform:translateY(-105%)}
.pre-in{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:26px}
.pre-mark{height:clamp(80px,14vw,150px);display:flex;align-items:center;white-space:nowrap;line-height:1}
.pre-mark span{display:inline-block;transition:transform .35s var(--spring)}
.pre-mark .ast{color:var(--red)}
.pre-sheet{position:relative;width:100%;padding:22px 22px 18px;background:var(--sheet);border:1px solid rgba(20,20,20,.12);box-shadow:6px 6px 0 var(--sh);transform:rotate(-1.5deg);animation:dropIn .9s var(--spring) backwards;--r:-1.5deg}
.pre.done .pre-sheet{transition:transform .5s var(--spring);transform:rotate(4deg) scale(1.03)}
.pre-top{display:flex;justify-content:space-between;margin-bottom:12px;font:500 12px/1 var(--f-code);color:var(--ink-2)}
.pre-bar{position:relative;height:30px;border:2px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.pre-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red) repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,214,10,.9) 10px 20px);background-size:28.28px 100%;border-right:2px solid var(--ink);transition:width .25s linear;animation:stripes .6s linear infinite}
@keyframes stripes{to{background-position:28.28px 0}}
.pre-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.pre-row b{font:700 44px/1 var(--f-code);letter-spacing:-1px}
.pre-row span{font:400 13px/1 var(--f-mono);color:var(--ink-2)}
.pre-file{margin:10px 0 0;height:1.4em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:400 12px/1.4 var(--f-mono);color:var(--ink-2)}
.pre-file.ok{color:var(--red);font-family:var(--f-code);font-weight:700}
body.loading{overflow:hidden}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
}

/* ============ PER-TAB PIECES ============ */
.print .cap{margin-top:9px;font:400 12px/1.4 var(--f-mono);color:var(--ink-2)}
.print .cap b{display:block;font:700 15px/1.2 var(--f-code);color:var(--ink);margin-bottom:3px}
.print .cap b i{font-style:normal;color:var(--red)}
.print .cap .sale{display:block;width:max-content;max-width:100%;margin-top:7px;background:var(--red);color:#fff;font:500 11px/1.3 var(--f-code);padding:4px 7px}
.print.note a,.print.note .big{display:block;font:700 22px/1.1 var(--f-code);margin-bottom:8px;color:var(--ink);text-decoration:none}
.print.note .go{display:inline-block;margin-top:10px;border:2px solid var(--ink);background:var(--sheet);padding:7px 10px;font:500 12px/1 var(--f-code)}
.print.note:hover .go{background:var(--ink);color:var(--yellow)}
.print.red{background:var(--red);color:#fff;border-color:var(--ink)}
.print.red .big,.print.red .go{color:#fff}
.print.red .go{background:transparent;border-color:#fff}
.print.red:hover .go{background:#fff;color:var(--red)}
.print.ink{background:var(--ink);color:var(--paper)}
.print.ink .big{color:var(--paper)}
.print.ink .go{background:transparent;border-color:var(--paper);color:var(--paper)}
.print.ink:hover .go{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.print.extra{padding:8px}
.print .badge{position:absolute;right:-8px;top:-8px;z-index:2;background:var(--red);color:#fff;font:700 11px/1 var(--f-code);padding:5px 7px;border:2px solid var(--ink);transform:rotate(6deg)}

/* screen printouts (video) */
.scr{position:relative;background:var(--ink);padding:22px 8px 30px;border-radius:4px}
.scr::before{content:"";position:absolute;left:9px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:10px 0 0 var(--yellow),20px 0 0 #6d6a63}
.scr::after{content:"▶ 00:00";position:absolute;left:10px;bottom:9px;font:500 10px/1 var(--f-code);color:var(--paper);letter-spacing:.06em}
.scr .bar{position:absolute;left:62px;right:10px;bottom:12px;height:4px;background:#3a3834}
.scr .bar i{display:block;height:100%;width:0;background:var(--red)}
.scr .vid{position:relative}
.scr img,.scr video{display:block;width:100%;height:auto;background:#000}
.scr video{position:absolute;inset:0;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.scr.live video{opacity:1}
.scr .rec{position:absolute;right:10px;top:6px;font:500 10px/1 var(--f-code);color:var(--red);opacity:0}
.scr.live .rec{opacity:1;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

/* skins: little figurines on a base */
.print.stand{padding:0;background:none;border:0;box-shadow:none;cursor:default;--p:10px}
.print.stand:hover,.print.stand.held{box-shadow:none}
.stand .stage{position:relative;width:calc(28 * var(--p));height:calc(44 * var(--p));perspective:1500px;cursor:ew-resize;touch-action:pan-y}
.stand .fig{position:absolute;left:50%;top:calc(35 * var(--p));width:0;height:0;transform-style:preserve-3d;will-change:transform}
.stand .fig *{transform-style:preserve-3d}
.stand .pt,.stand .pv,.stand .cb{position:absolute;left:0;top:0;width:0;height:0}
.stand .fc{position:absolute;left:0;top:0;display:block;background-image:var(--tex);background-size:calc(64 * var(--p)) calc(64 * var(--p));background-repeat:no-repeat;image-rendering:pixelated;backface-visibility:hidden}
.stand .ov .fc{backface-visibility:visible}
.stand .arm-r .pv{animation:swingA 3.2s ease-in-out infinite alternate}
.stand .arm-l .pv{animation:swingA 3.2s ease-in-out infinite alternate-reverse}
.stand .head .pv{animation:look 5s ease-in-out infinite alternate}
@keyframes swingA{from{transform:rotateX(9deg) rotateZ(var(--az,0deg))}to{transform:rotateX(-9deg) rotateZ(var(--az,0deg))}}
@keyframes look{0%,30%{transform:rotateY(-14deg)}70%,100%{transform:rotateY(12deg) rotateX(4deg)}}
.stand .plate{position:absolute;left:calc(-12 * var(--p));top:calc(-12 * var(--p));width:calc(24 * var(--p));height:calc(24 * var(--p));border-radius:50%;background:#1a1a1a;cursor:grab}
.stand .plate.top{background:var(--red);box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 calc(2.2 * var(--p)) var(--red),inset 0 0 0 calc(2.2 * var(--p) + 2px) rgba(20,20,20,.35)}
.stand .shadow{position:absolute;left:50%;top:calc(35.6 * var(--p));width:calc(27 * var(--p));height:calc(6 * var(--p));margin-left:calc(-13.5 * var(--p));border-radius:50%;background:var(--sh);filter:blur(1px);transform:translate(10px,calc(2 * var(--p)))}
.stand .tag{display:block;margin:6px auto 0;width:max-content;background:var(--sheet);border:1.5px solid var(--ink);padding:4px 8px;font:500 11px/1 var(--f-code);box-shadow:3px 3px 0 var(--sh);cursor:grab}

/* music: sleeves, tracks, threads */
.threads{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.threads path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1 4.5}
.threads path.on{stroke:var(--red);stroke-dasharray:none;stroke-width:2.2}
.print.album{width:250px;padding:0;background:none;border:0;box-shadow:none;z-index:2}

/* ---------------- skins: spin with inertia ---------------- */
const SPIN = new Map();
const spinState = f => { if(!SPIN.has(f)) SPIN.set(f, { ry: -25 + Math.random() * 50, v: 0, held: false }); return SPIN.get(f); };
function spinGrab(f){ const s = spinState(f); s.held = true; s.v = 0; }
function spinMove(f, dx){ const s = spinState(f); s.ry += dx * .8; s.v = dx * .8; f.style.transform = `rotateX(-14deg) rotateY(${s.ry}deg)`; }
function spinDrop(f){ spinState(f).held = false; }
(function spinLoop(){
  document.querySelectorAll('.fig').forEach(f => {
    const s = spinState(f); if(s.held) return;
    s.v += ((reduced ? 0 : .35) - s.v) * .025; s.ry += s.v;
    f.style.transform = `rotateX(-14deg) rotateY(${s.ry.toFixed(2)}deg)`;
  });
  requestAnimationFrame(spinLoop);
})();
/* the phone feed spins figures by touch too */

$('#feed').addEventListener('pointerdown', e => { const f = e.target.closest('.fig'); if(!f || e.target.closest('.plate')) return; fspin = { f, x: e.clientX, id: e.pointerId }; spinGrab(f); });
addEventListener('pointermove', e => { if(fspin && e.pointerId === fspin.id){ spinMove(fspin.f, e.clientX - fspin.x); fspin.x = e.clientX; } });
['pointerup','pointercancel'].forEach(t => addEventListener(t, e => { if(fspin && e.pointerId === fspin.id){ spinDrop(fspin.f); fspin = null; } }));

/* ---------------- music: albums spill tracks on a thread ---------------- */
const openAlbums = new Map(); // album index -> [track elements]
const leaving = new Map();    // album index -> tracks flying back in
const albGen = {};
function toWorld(el){
  const m = new DOMMatrix(getComputedStyle(world).transform), dr = desk.getBoundingClientRect(), b = el.getBoundingClientRect();
  return { x: (b.left + b.width / 2 - dr.left - m.e) / m.a, y: (b.top + b.height / 2 - dr.top - m.f) / m.a };
}
function drawThreads(){
  const svg = $('#threads'); if(!svg) return;
  let d = '';
  const both = new Map(openAlbums);
  leaving.forEach((els, ai) => both.set(ai, (both.get(ai) || []).concat(els)));
  both.forEach((els, ai) => {
    const al = world.querySelector(`.album[data-c="m-${ALBUMS[ai].id}"] .sleeve`); if(!al) return;
    const a = toWorld(al);
    els.forEach(el => {
      const t = toWorld(el), sag = 40 + Math.abs(t.x - a.x) * .12;
      const on = el.classList.contains('playing') ? ' class="on"' : '';
      d += `<path${on} d="M${a.x.toFixed(1)} ${a.y.toFixed(1)} Q${((a.x + t.x) / 2).toFixed(1)} ${(Math.max(a.y, t.y) + sag).toFixed(1)} ${t.x.toFixed(1)} ${t.y.toFixed(1)}"/>`;
    });
  });
  svg.innerHTML = d;
}
let thrUntil = 0, thrOn = false;
function threadsFor(ms){
  thrUntil = Math.max(thrUntil, performance.now() + ms);
  if(thrOn) return; thrOn = true;
  (function loop(){ drawThreads(); if(performance.now() < thrUntil) requestAnimationFrame(loop); else thrOn = false; })();
}
function toggleAlbum(el, ai, want){
  const a = ALBUMS[ai];
  const isOpen = openAlbums.has(ai);
  if(want !== undefined && want === isOpen) return;
  // every click gets a new generation; timers from older clicks see the mismatch and do nothing
  const gen = albGen[ai] = (albGen[ai] || 0) + 1;
  const ax = parseFloat(el.style.getPropertyValue('--x')), ay = parseFloat(el.style.getPropertyValue('--y'));
  if(isOpen){
    el.classList.remove('open');
    const els = openAlbums.get(ai); openAlbums.delete(ai);
    const prev = leaving.get(ai) || []; leaving.set(ai, prev.concat(els));
    els.forEach((t, j) => setTimeout(() => { t.style.setProperty('--x', (ax + 20) + 'px'); t.style.setProperty('--y', (ay + 110) + 'px'); t.classList.add('gone'); }, j * 30));
    threadsFor(1000);
    setTimeout(() => {
      els.forEach(t => t.remove());
      const rest = (leaving.get(ai) || []).filter(t => !els.includes(t));
      rest.length ? leaving.set(ai, rest) : leaving.delete(ai);
      drawThreads();
    }, 700 + els.length * 30);
    return;
  }
  el.classList.add('open');
  // anything still flying back into this sleeve is dropped at once so tracks never double up
  (leaving.get(ai) || []).forEach(t => t.remove()); leaving.delete(ai);
  const r = rnd(97 + ai), frag = document.createDocumentFragment(), els = [];
  const cols = a.tracks.length > 4 ? 2 : 1;
  a.tracks.forEach((t, j) => {
    const k = reg({ act:'track', a: ai, i: j });
    const f = document.createElement('figure');
    f.className = 'print track gone'; f.dataset.k = k; f.dataset.a = ai; f.dataset.t = j; f.tabIndex = 0;
    f.innerHTML = `<span class="pp">▶</span><span class="n">${String(j + 1).padStart(2,'0')}</span><span class="t">${esc(nm(t[0]))}</span><span class="eq"><i></i><i></i><i></i></span>`;
    f.style.cssText = `--x:${ax + 10}px;--y:${ay + 100}px;--r:${((r() - .5) * 30).toFixed(1)}deg`;
    frag.appendChild(f); els.push(f);
  });
  $('#threads').after(frag);
  openAlbums.set(ai, els);
  void world.offsetWidth;
  els.forEach((f, j) => setTimeout(() => {
    if(albGen[ai] !== gen) return;
    const col = cols === 2 ? j % 2 : 0, row = cols === 2 ? (j / 2 | 0) : j;
    const tx = ax - 30 + col * 270 + (cols === 1 ? 20 : 0) + (r() - .5) * 50;
    const ty = ay + 330 + row * (cols === 1 ? 105 : 92) + (r() - .5) * 26;
    f.style.setProperty('--x', tx.toFixed(0) + 'px'); f.style.setProperty('--y', ty.toFixed(0) + 'px');
    f.style.setProperty('--r', ((r() - .5) * 10).toFixed(1) + 'deg'); f.classList.remove('gone');
  }, 40 + j * 70));
  markPlaying(); threadsFor(1400 + a.tracks.length * 70);
}

/* ---------------- lightbox ---------------- */
const lb = $('#lb');
let lbGal = [], lbI = 0;
function openLb(gal, i){ lbGal = gal; lbI = i; showLb(); lb.hidden = false; $('#lbX').focus(); }
function showLb(){
  const g = lbGal[lbI], m = $('#lbMedia');
  m.innerHTML = U(g.video ? `<video src="${g.video}" poster="${g.poster}" controls autoplay playsinline></video>` : `<img src="${g.src}" alt="${esc(g.name || '')}">`);
  $('#lbName').textContent = g.name || '';
  $('#lbSub').textContent = g.sub || '';
  const many = lbGal.length > 1;
  $('#lbPrev').hidden = !many; $('#lbNext').hidden = !many;
}
function stepLb(d){ lbI = (lbI + d + lbGal.length) % lbGal.length; showLb(); }
function closeLb(){ lb.hidden = true; $('#lbMedia').innerHTML = ''; }
$('#lbX').addEventListener('click', closeLb);
$('#lbPrev').addEventListener('click', () => stepLb(-1));
$('#lbNext').addEventListener('click', () => stepLb(1));
lb.addEventListener('click', e => { if(e.target === lb) closeLb(); });
addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeLb(); closeStack(); }
  if(!lb.hidden && lbGal.length > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) stepLb(e.key === 'ArrowLeft' ? -1 : 1);
});

/* ---------------- preloader: pull every asset in before the desk opens ---------------- */
function assetList(){
  const L = new Set(['assets/dev/mawrelle.svg', 'assets/dev/aura-drop.webp', 'assets/characters/true-lamex.webp']);
  Object.values(WORKS).forEach(list => list.forEach(w => L.add(D + w[0] + '.webp')));
  R3D.forEach(w => L.add(`assets/3d/${w[0]}.webp`));
  VIDEOS.forEach(v => { L.add(`assets/video/${v.f}.webp`); L.add(`assets/video/${v.f}.mp4`); });
  CHARS.forEach(c => { L.add(`assets/characters/${c.f}.webp`); (c.extra || []).forEach(e => L.add(`assets/characters/extra/${e[0]}.webp`)); });
  SKINS.forEach(t => L.add(t));
  ALBUMS.forEach(a => { if(a.cover) L.add(a.cover); });
  return [...L];
}
function preload(){
  const pre = $('#pre'), fill = $('#preFill'), pct = $('#prePct'), mb = $('#preMb'), cnt = $('#preCount'), file = $('#preFile');
  document.body.classList.add('loading');
  addMark($('#preMark'), true);
  // nothing on the page reacts while the loader is up: no keys, no wheel, no clicks through
  const KEYS = /^(Tab|Enter| |Escape|Arrow\w+|PageUp|PageDown|Home|End)$/;
  const block = e => { if(!pre.isConnected) return; if(e.type === 'keydown' && !KEYS.test(e.key)) return; e.preventDefault(); e.stopPropagation(); };
  ['keydown','wheel','touchmove'].forEach(t => addEventListener(t, block, { capture:true, passive:false }));
  const list = assetList();
  const FONT_W = 400000; // the Google fonts count as a small slice of the bar
  const total = list.reduce((n, p) => n + (SIZES[p] || 200000), 0) + FONT_W;
  let got = 0, done = 0, shown = 0;
  const pad = n => String(n).padStart(3, '0');
  const draw = () => {
    const p = Math.min(100, got / total * 100);
    shown += (p - shown) * .25; if(p - shown < .1) shown = p;
    fill.style.width = shown.toFixed(2) + '%'; pct.textContent = Math.floor(shown) + '%';
    pre.setAttribute('aria-valuenow', Math.floor(shown));
    mb.textContent = `${(got / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`;
    cnt.textContent = `${pad(done)}/${pad(list.length)}`;
  };
  let raf; (function tick(){ draw(); raf = requestAnimationFrame(tick); })();
  async function one(p){
    const expect = SIZES[p] || 200000; let seen = 0;
    file.textContent = '> ' + p.replace('assets/', '');
    try{
      const res = await fetch(p);
      if(!res.ok) throw 0;
      const type = res.headers.get('content-type') || '';
      let blob;
      if(res.body && res.body.getReader){
        const reader = res.body.getReader(), parts = [];
        for(;;){ const { done: d, value } = await reader.read(); if(d) break; parts.push(value); const add = Math.min(value.length, Math.max(0, expect - seen)); seen += value.length; got += add; }
        blob = new Blob(parts, { type });
      } else blob = await res.blob();
      BLOB[p] = URL.createObjectURL(blob);
    }catch(e){ /* a missing file just keeps its normal URL */ }
    got += Math.max(0, expect - seen); done++;
  }
  async function pool(n){
    let i = 0;
    await Promise.all(Array.from({ length: n }, async () => { while(i < list.length) await one(list[i++]); }));
  }
  const fonts = (async () => {
    try{
      await Promise.all(FONTS.map(f => document.fonts.load(`${f[4]} ${f[2]} 40px ${f[1]}`)).concat(
        ['500 14px "Fira Code"','700 14px "Fira Code"','400 14px "PT Mono"'].map(f => document.fonts.load(f))));
      await document.fonts.ready;
    }catch(e){}
    got += FONT_W;
  })();
  return Promise.all([pool(6), fonts]).then(async () => {
    // decode the pictures now so the first pan across the desk never stutters
    file.textContent = '> раскладываю распечатки…';
    await Promise.all(list.filter(p => /\.(webp|png|svg)$/.test(p) && BLOB[p]).map(p => { const im = new Image(); im.src = BLOB[p]; return im.decode ? im.decode().catch(() => {}) : null; }));
    got = total; draw();
    await new Promise(r => setTimeout(r, 380));
    cancelAnimationFrame(raf); fill.style.width = '100%'; pct.textContent = '100%';
    file.textContent = '✓ всё на столе'; file.classList.add('ok');
    await new Promise(r => setTimeout(r, 450));
    renderTabs(); buildDesk();
    pre.classList.add('done');
    setTimeout(() => { pre.remove(); document.body.classList.remove('loading'); }, 1250);
  });
}
/* tracks are heavy, so they follow in the background once the desk is open; until one lands it simply streams */
function trackList(){ const L = []; ALBUMS.forEach(a => a.tracks.forEach(t => L.push(`assets/music/${a.dir}/${t[1]}.mp3`))); return L; }
async function loadMusic(){
  const list = trackList();
  // the track that is playing (or the next one) jumps the queue
  const next = () => { if(now){ const a = ALBUMS[now.a]; for(let j = now.i; j < a.tracks.length; j++){ const p = `assets/music/${a.dir}/${a.tracks[j][1]}.mp3`; const k = list.indexOf(p); if(k >= 0) return list.splice(k, 1)[0]; } } return list.shift(); };
  const worker = async () => { for(let p; (p = next());){ try{ const r = await fetch(p); if(r.ok) BLOB[p] = URL.createObjectURL(await r.blob()); }catch(e){} } };
  await Promise.all([worker(), worker()]);
}
preload().then(() => setTimeout(loadMusic, 1500));
})();
